[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "neovax-explorer"
version = "0.1.0"
description = "Reproducible exploration of published NeoVax candidates and evidence"
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1,<4",
    "httpx>=0.28,<1",
    "rich>=14,<16",
    "jinja2>=3.1,<4",
    "plotly>=6,<8",
    "matplotlib>=3.9,<4",
    "scipy>=1.14,<2",
    "pyahocorasick>=2.1,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "ruff>=0.14"]

[project.scripts]
neovax = "neovax.cli:main"

[tool.setuptools.package-data]
neovax = ["resources/*.json", "templates/*"]

[tool.pytest.ini_options]
markers = ["integration: tests requiring downloaded source data"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
